name: Deploy React App

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    # Inject secrets into the environment
    - name: Build app
      run: |
        echo "REACT_APP_GOOGLE_API_KEY=${{ secrets.REACT_APP_GOOGLE_API_KEY }}" >> .env
        echo "REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}" >> .env
        echo "REACT_APP_ATTENDANCE_SPREADSHEET_ID=${{ secrets.REACT_APP_ATTENDANCE_SPREADSHEET_ID }}" >> .env
        echo "REACT_APP_LEAVE_SPREADSHEET_ID=${{ secrets.REACT_APP_LEAVE_SPREADSHEET_ID }}" >> .env
        echo "REACT_APP_RAHUL_EMAILID=${{ secrets.REACT_APP_RAHUL_EMAILID }}" >> .env
        echo "REACT_APP_SHAILENDER_EMAILID=${{ secrets.REACT_APP_SHAILENDER_EMAILID }}" >> .env
        echo "REACT_APP_ROHIT_EMAILID=${{ secrets.REACT_APP_ROHIT_EMAILID }}" >> .env
        npm install
        npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build

